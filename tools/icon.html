<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
import { Crystal } from '../www/src/sim/crystal.js';
import { drawCrystal, crystalExtent } from '../www/src/render/crystalRender.js';
const p = new URLSearchParams(location.search);
const size = Number(p.get('size') || 512);
const maskable = p.has('maskable');
const c = document.getElementById('c');
c.width = c.height = size;
const g = c.getContext('2d');
const r = maskable ? 0 : size * 0.22;
g.beginPath();
g.roundRect(0, 0, size, size, r);
g.clip();
const bg = g.createRadialGradient(size * 0.5, size * 0.42, 0, size * 0.5, size * 0.5, size * 0.75);
bg.addColorStop(0, '#2b3d7c');
bg.addColorStop(0.55, '#121b40');
bg.addColorStop(1, '#070b1c');
g.fillStyle = bg;
g.fillRect(0, 0, size, size);
const glow = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.45);
glow.addColorStop(0, 'rgba(170,205,255,0.35)');
glow.addColorStop(1, 'rgba(170,205,255,0)');
g.fillStyle = glow;
g.fillRect(0, 0, size, size);
const crystal = Crystal.fromRecipe(11, [['plate', 3.4], ['dendrite', 13, 1], ['plate', 2.6], ['dendrite', 9, 0.75], ['plate', 3.5]]);
const ext = crystalExtent(crystal);
const k = (size * (maskable ? 0.3 : 0.4)) / ext;
g.translate(size / 2, size / 2);
g.rotate(-Math.PI / 2);
g.scale(k, k);
drawCrystal(g, crystal);
window.__png = c.toDataURL('image/png');
document.title = 'ready';
</script></body></html>
